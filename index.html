<!DOCTYPE html>
<html>
<head>
<title>Dust Racing 2D</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  text-align:center;
  font-family:Arial;
}

canvas {
  display:none;
  margin:auto;
  border:2px solid white;
}

#menu, #gameOverScreen {
  position:absolute;
  width:100%;
  top:30%;
}

.car-select img {
  width:80px;
  margin:10px;
  border:2px solid white;
  cursor:pointer;
}

.selected {
  border:4px solid yellow;
}

button {
  padding:10px 20px;
  margin:10px;
  font-size:18px;
}
</style>
</head>

<body>

<h2>🚗 Dust Racing 2D</h2>

<div id="menu">
  <h1>Select Car</h1>
  <div class="car-select">
    <img src="https://i.ibb.co/7Q2R6Qp/red-car.png" onclick="selectCar(0)" id="car0">
    <img src="https://i.ibb.co/Z6X9G6s/blue-car.png" onclick="selectCar(1)" id="car1">
    <img src="https://i.ibb.co/YXcK4Qh/yellow-car.png" onclick="selectCar(2)" id="car2">
  </div>

  <h2>Select Map</h2>
  <button onclick="selectMap('sand')">🏜️ Sand</button>
  <button onclick="selectMap('night')">🌙 Night</button>
  <button onclick="selectMap('space')">🌌 Space</button>

  <br>
  <button onclick="startGame()">START GAME</button>
</div>

<div id="gameOverScreen" style="display:none;">
  <h1>GAME OVER</h1>
  <div id="finalScore"></div>
  <div id="highScore"></div>
  <button onclick="restartGame()">Restart</button>
</div>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// car images
let carImages = [
  "https://i.ibb.co/7Q2R6Qp/red-car.png",
  "https://i.ibb.co/Z6X9G6s/blue-car.png",
  "https://i.ibb.co/YXcK4Qh/yellow-car.png"
];

let selectedCar = 0;
let selectedMap = "sand";

function selectCar(i){
  selectedCar = i;
  document.querySelectorAll(".car-select img").forEach(e=>e.classList.remove("selected"));
  document.getElementById("car"+i).classList.add("selected");
}

function selectMap(m){
  selectedMap = m;
}

// sounds
const engineSound = new Audio("https://www.soundjay.com/transportation/sounds/car-engine-1.mp3");
const crashSound = new Audio("https://www.soundjay.com/mechanical/sounds/crash-1.mp3");

let carImg = new Image();
let car, obstacles, score, speed, gameOver;

// swipe control
let startX = 0;
canvas.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

canvas.addEventListener("touchmove", e=>{
  let diff = e.touches[0].clientX - startX;
  if(diff > 30) car.x += 20;
  if(diff < -30) car.x -= 20;
});

// keyboard
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft") car.x -= 20;
  if(e.key==="ArrowRight") car.x += 20;
});

function startGame(){
  document.getElementById("menu").style.display="none";
  canvas.style.display="block";

  carImg.src = carImages[selectedCar];

  engineSound.loop = true;
  engineSound.play();

  init();
  gameLoop();
}

function restartGame(){
  location.reload();
}

function init(){
  car = {x:370,y:400,w:50,h:70};
  obstacles = [];
  score = 0;
  speed = 4;
  gameOver = false;
}

// background
function drawBackground(){
  if(selectedMap === "space"){
    ctx.fillStyle="black";
    ctx.fillRect(0,0,800,500);
    ctx.fillStyle="white";
    for(let i=0;i<50;i++){
      ctx.fillRect(Math.random()*800, Math.random()*500,2,2);
    }
  }

  if(selectedMap === "night"){
    ctx.fillStyle="#001f3f";
    ctx.fillRect(0,0,800,500);
  }

  if(selectedMap === "sand"){
    ctx.fillStyle="#c2b280";
    ctx.fillRect(0,0,800,500);
  }
}

// road
let roadY=0;
function drawRoad(){
  ctx.fillStyle="#333";
  ctx.fillRect(250,0,300,500);

  ctx.strokeStyle="white";
  ctx.setLineDash([20,20]);
  ctx.beginPath();
  ctx.moveTo(400,roadY);
  ctx.lineTo(400,roadY+500);
  ctx.stroke();

  roadY += speed;
  if(roadY>40) roadY=0;
}

// car
function drawCar(){
  ctx.drawImage(carImg, car.x, car.y, car.w, car.h);
}

// obstacles
function createObstacle(){
  obstacles.push({
    x:260+Math.random()*250,
    y:-50,
    w:40,
    h:40
  });
}

function drawObstacles(){
  obstacles.forEach((o,i)=>{
    o.y += speed;

    ctx.fillStyle="gray";
    ctx.fillRect(o.x,o.y,o.w,o.h);

    if(
      car.x < o.x + o.w &&
      car.x + car.w > o.x &&
      car.y < o.y + o.h &&
      car.y + car.h > o.y
    ){
      crashSound.play();
      engineSound.pause();
      gameOver=true;
    }

    if(o.y>500) obstacles.splice(i,1);
  });
}

// score
function updateScore(){
  if(!gameOver) score++;
}

// loop
function gameLoop(){
  if(gameOver){
    document.getElementById("gameOverScreen").style.display="block";
    document.getElementById("finalScore").innerText="Score: "+score;

    let high = localStorage.getItem("highScore") || 0;
    if(score > high){
      localStorage.setItem("highScore", score);
      high = score;
    }

    document.getElementById("highScore").innerText="High Score: "+high;
    return;
  }

  drawBackground();
  drawRoad();
  drawCar();
  drawObstacles();
  updateScore();

  requestAnimationFrame(gameLoop);
}

setInterval(createObstacle,1200);
setInterval(()=>{ speed+=0.3; },4000);

</script>

</body>
</html>
